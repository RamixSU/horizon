name: Build iOS IPA

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Horizon iOS IPA
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          targets: aarch64-apple-ios

      - name: Build Horizon IPA
        run: |
          chmod +x packaging/ios/build_ipa.sh
          ./packaging/ios/build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-IPA
          path: target/ios/Horizon.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ios/Horizon.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
